[package]
name = "lumi"
version = "1.1.0"
authors = ["David R. Bustos"]
edition = "2024"
rust-version = "1.92"
description = "A living notch for Windows: music (Music Assistant), synced lyrics, to-do with voice capture (Wyoming Whisper), charging and headphones peeks."
license = "GPL-3.0-only"
repository = "https://github.com/dbustosrc/Lumi"
publish = false

[[bin]]
name = "lumi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
toml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
cpal = "0.18"
webrtc-vad = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2.6"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Enumeration",
    "Devices_Power",
    "System_Power",
    "Media_Control",
    "Storage_Streams",
    "Networking_Connectivity",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Wmi",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-collections = "0.3"
windows-core = "0.62"
windows-numerics = "0.3.1"

[profile.release]
opt-level = 3
strip = true
panic = "abort"
